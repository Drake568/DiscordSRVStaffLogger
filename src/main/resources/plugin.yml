name: DiscordSRVStaffLogger
version: '${project.version}'
main: com.discordsrvstafflogger.DiscordSRVStaffLogger
api-version: '1.21'
author: Jacob
description: Logs sensitive staff actions to a Discord channel via DiscordSRV.

# All integrations are optional and guarded at runtime. A missing plugin simply
# disables the path that depends on it (a warning is logged once on enable).
softdepend:
  - DiscordSRV
  - LiteBans
  - InvSeePlusPlus
  - Essentials
  - CoreProtect

commands:
  staffloggerreload:
    description: Reloads DiscordSRVStaffLogger's config.yml without restarting the server.
    usage: /<command>
    aliases: [dslreload]
    permission: discordsrvstafflogger.reload

permissions:
  discordsrvstafflogger.reload:
    description: Allows reloading DiscordSRVStaffLogger's config.yml.
    default: op
